name: Verify Lockdown
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      assessment_url:
        description: Optional HTTPS assessment endpoint for the debug APK
        required: false
        type: string

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Select JDK 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        run: |
          sdk_root="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk_root/cmdline-tools"
          curl --fail --silent --show-error --location --http1.1 \
            --retry 4 --retry-all-errors --retry-max-time 120 --connect-timeout 15 --max-time 120 \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            --output "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          (set +o pipefail; yes | "$sdkmanager" --sdk_root="$sdk_root" --licenses)
          "$sdkmanager" --sdk_root="$sdk_root" 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96
        with:
          gradle-version: '8.11.1'
      - name: Verify release signing guard
        run: |
          output="$RUNNER_TEMP/lockdown-signing-guard.log"
          if gradle -p android :app:checkLockdownReleaseSigning > "$output" 2>&1; then
            echo "Signing guard unexpectedly accepted missing credentials."
            exit 1
          fi
          if ! grep -F 'Release signing requires a valid LOCKDOWN_KEYSTORE file' "$output"; then
            cat "$output"
            exit 1
          fi
      - run: gradle -p android :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
        env:
          LOCKDOWN_ASSESSMENT_URL: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.assessment_url || vars.LOCKDOWN_ASSESSMENT_URL) || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lockdown-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
